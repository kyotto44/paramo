# Configuración de Netlify para Páramo.
# Netlify instala las dependencias, ejecuta "npm run build" y publica la carpeta dist/.
# El sitio no tiene claves de API ni funciones: lo único dinámico es el formulario de reservas,
# que recibe Netlify Forms. Netlify lo detecta al leer el HTML compilado (atributo data-netlify).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad para todas las páginas.
[[headers]]
  for = "/*"
  [headers.values]
    # Solo se cargan recursos del propio sitio. No hay CDN, fuentes externas ni scripts en línea.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Nadie puede meter el sitio en un iframe (clickjacking).
    X-Frame-Options = "DENY"
    # El navegador no adivina tipos de archivo.
    X-Content-Type-Options = "nosniff"
    # Al salir a otro sitio solo se envía el dominio, no la ruta completa.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # El sitio no usa cámara, micrófono, ubicación ni pagos.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Siempre por HTTPS.
    Strict-Transport-Security = "max-age=31536000"

# Vite pone un hash en el nombre de cada archivo compilado (main-3f9a1c.js):
# si el archivo cambia, cambia el nombre. Por eso se pueden guardar un año sin riesgo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imagenes/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
